name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Arch Linux
        run: pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm \
            base-devel \
            cmake \
            gcc \
            qt6-base \
            qt6-declarative \
            layer-shell-qt \
            namcap

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             makepkg --nodeps --noconfirm --cleanbuild --clean"

      - name: Find package
        id: package
        run: |
          pkg="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -print -quit
          )"
          if [ -z "$pkg" ]; then
            echo "ERROR: No Arch package was produced."
            exit 1
          fi
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run namcap
        run: namcap "${{ steps.package.outputs.pkg }}"

      - name: Verify package
        run: |
          pacman -Qip "${{ steps.package.outputs.pkg }}"
          pacman -Qlp "${{ steps.package.outputs.pkg }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemenu-arch-package
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: fedora:latest

    steps:
      - name: Fix DNS (avoid codeload timeouts)
        run: echo "nameserver 8.8.8.8" | tee /etc/resolv.conf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Fedora
        run: dnf -y upgrade

      - name: Install build dependencies
        run: |
          dnf -y install \
            rpm-build \
            rpmdevtools \
            cmake \
            gcc-c++ \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            layer-shell-qt-devel \
            rpmlint \
            spectool \
            git

      - name: Create build tree
        run: |
          mkdir -p rpm/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm/SPECS/smilemenu.spec rpm/SPECS/

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Download release source
        run: |
          spectool -g -R \
            --define "_topdir $GITHUB_WORKSPACE/rpm" \
            rpm/SPECS/smilemenu.spec

      - name: Verify source archive
        run: ls -lh rpm/SOURCES/

      - name: Build RPM
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             rpmbuild \
               --define '_topdir $GITHUB_WORKSPACE/rpm' \
               -ba rpm/SPECS/smilemenu.spec"

      - name: Find package
        id: package
        run: |
          pkg="$(
            find "$GITHUB_WORKSPACE/rpm/RPMS" \
              -type f \
              -name '*.rpm' \
              -not -name '*-debuginfo-*.rpm' \
              -print -quit
          )"
          if [ -z "$pkg" ]; then
            echo "ERROR: No RPM was produced."
            exit 1
          fi
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run rpmlint
        run: |
          rpmlint "${{ steps.package.outputs.pkg }}" || true

      - name: Verify package
        run: |
          rpm -qip "${{ steps.package.outputs.pkg }}"
          rpm -qpl "${{ steps.package.outputs.pkg }}"
          echo
          echo "Runtime requirements:"
          rpm -qp --requires "${{ steps.package.outputs.pkg }}"

      - name: Prepare package artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${{ steps.package.outputs.pkg }}" "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemenu-fedora-rpm
          path: artifacts/*.rpm
          if-no-files-found: error

  debian:
    name: Build Debian package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            debhelper-compat \
            qt6-base-dev \
            qt6-declarative-dev \
            liblayershellqtinterface-dev \
            layer-shell-qt \
            qml6-module-org-kde-layershell \
            lintian

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$(dirname "$GITHUB_WORKSPACE")"

      - name: Build package
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             dpkg-buildpackage -us -uc -b"

      - name: Find package
        id: package
        run: |
          pkg="$(
            find "$(dirname "$GITHUB_WORKSPACE")" \
              -maxdepth 1 \
              -type f \
              -name 'smilemenu_*.deb' \
              -print -quit
          )"
          if [ -z "$pkg" ]; then
            echo "ERROR: No .deb was produced."
            exit 1
          fi
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run lintian (ignore errors)
        run: |
          lintian "${{ steps.package.outputs.pkg }}" || true

      - name: Verify package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.pkg }}"
          dpkg-deb --contents "${{ steps.package.outputs.pkg }}"

      - name: Prepare package artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${{ steps.package.outputs.pkg }}" "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemenu-debian-package
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - arch
      - fedora
      - debian
    permissions:
      contents: write

    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: smilemenu-arch-package
          path: artifacts/arch

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: smilemenu-fedora-rpm
          path: artifacts/fedora

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: smilemenu-debian-package
          path: artifacts/debian

      - name: Verify artifacts
        run: |
          set -e
          echo "Arch:"
          find artifacts/arch -type f -print
          echo
          echo "Fedora:"
          find artifacts/fedora -type f -print
          echo
          echo "Debian:"
          find artifacts/debian -type f -print

          test -n "$(find artifacts/arch -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$(find artifacts/fedora -type f -name '*.rpm' -print -quit)"
          test -n "$(find artifacts/debian -type f -name '*.deb' -print -quit)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          commit_sha="${GITHUB_SHA}"

          commit_message="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${repo}/commits/${commit_sha}" |
            python3 -c \
              'import json,sys; print(json.load(sys.stdin)["commit"]["message"])'
          )"

          notes="$(printf '%s\n' "$commit_message" | sed '1d')"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            gh release edit "$tag" \
              --repo "$repo" \
              --title "$tag" \
              --notes "$notes"
          else
            echo "Creating release ${tag}."
            gh release create "$tag" \
              --repo "$repo" \
              --target "$commit_sha" \
              --title "$tag" \
              --notes "$notes"
          fi

          find artifacts -type f -print0 |
          while IFS= read -r -d '' file; do
            echo "Uploading $(basename "$file")..."
            gh release upload "$tag" "$file" \
              --repo "$repo" \
              --clobber
          done

          echo "Release ${tag} published successfully."
